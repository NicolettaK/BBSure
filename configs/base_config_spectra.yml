# BBPower config of the power spectra (BBPowerSpecter + BBPowerSummarizer).
# @DATA@ is replaced with the data directory of BBSure by run_spectra.sh.

global:
    nside: 128
    compute_dell: True

BBPowerSpecter:
    bpw_edges: "@DATA@/bpw_edges_nside128.txt"
    purify_B: True
    n_iter: 3

BBPowerSummarizer:
    nulls_covar_type: "diagonal"
    nulls_covar_diag_order: 0
    data_covar_type: "block_diagonal"
    data_covar_diag_order: 0
