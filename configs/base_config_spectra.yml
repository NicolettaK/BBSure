# Configurazione BBPower base per il decision tree (PySM_tests)
# Autore: nkrach@sissa.it
#
# Questo file e' il punto di partenza per TUTTI i fit del decision tree.
# decision_tree.py ne fa una copia per ogni nodo e modifica solo:
#   - BBCompSep.sampler            (maximum_likelihood / polychord / single_point)
#   - BBCompSep.fg_model.use_moments
#   - i parametri fissati (r=0, amp_beta=0, parametri bloccati al best fit)
#   - i valori centrali dei tophat (punto di partenza del minimizer)
# I blocchi `moments` devono restare per ENTRAMBE le componenti: BBCompSep li
# legge per tutte le componenti appena use_moments=True. I momenti "spenti"
# vengono fissati con amp_beta=0.

global:
    nside: 128
    compute_dell: True

BBPowerSpecter:
    bpw_edges: "@ROOT@/data/bpw_edges_nside128.txt"
    purify_B: True
    n_iter: 3

BBPowerSummarizer:
    nulls_covar_type: "diagonal"
    nulls_covar_diag_order: 0
    data_covar_type: "block_diagonal"
    data_covar_diag_order: 0

BBCompSep:
    sampler: 'maximum_likelihood'
    likelihood_type: 'chi2'
    r_init: 1.e-3
    pol_channels: ['B']
    l_min: 30
    l_max: 250
    # emcee (non usato dal tree, ma lasciato per run manuali)
    nwalkers: 32
    n_iters: 3000
    # PolyChord: sovrascritti da tree_config.yml
    nlive: 300
    nrepeat: 20

    cmb_model:
        cmb_templates:
            - "@ROOT@/data/camb/camb_lens_nobb.dat"
            - "@ROOT@/data/camb/camb_lens_r1.dat"
        params:
            r_tensor: ['r_tensor', 'tophat', [-0.02, 0.00, 0.06]]
            A_lens:   ['A_lens',   'fixed',  [1.0]]

    fg_model:
        use_moments: False
        # lmax per i Wigner-3j dei momenti (default BBPower 384 -> cubo da
        # ~450 MB). Deve essere <= n_ell di BBCompSep = numero di ell >= 2
        # nelle finestre (2..3*nside-1 -> 190 a nside 64), altrimenti
        # evaluate_1x1 fallisce sul broadcast.
        moments_lmax: 190
        # Termine 1x1 dei momenti tabulato su una griglia (alpha, gamma) e
        # interpolato: ~5x piu' veloce, stesso risultato entro 1e-5.
        # Richiede BBPower sul branch skip-zero-moments (commit 0a1d376).
        moments_interp: True

        component_1:
            name: Dust
            sed: Dust
            cl:
                BB: ClPowerLaw
            sed_parameters:
                beta_d:  ['beta_d', 'Gaussian', [1.54, 0.11]]
                temp_d:  ['temp',   'fixed',    [20.]]
                nu0_d:   ['nu0',    'fixed',    [353.]]
            cl_parameters:
                BB:
                    amp_d_bb:   ['amp',   'tophat', [0., 24., 100.]]  # PySM d1 in the SO patch: A_d_BB ~ 24
                    alpha_d_bb: ['alpha', 'tophat', [-2., -0.53, 0.5]]
                    l0_d_bb:    ['ell0',  'fixed',  [80.]]
            cross:
                # dust-synchrotron amplitude correlation (PySM templates are correlated)
                epsilon_ds: ['component_2', 'tophat', [-1., 0., 1.]]
            moments:
                gamma_d_beta: ['gamma_beta', 'tophat', [-6., -3.5, -2.]]
                amp_d_beta:   ['amp_beta',   'tophat', [ 0.,  0.,   1.]]
                # log10(sigma_beta): log-uniform prior on the rms of delta-beta (BBPower
                # moments-sigma); used instead of amp when the moment is on
                logsig_d_beta: ['logsig_beta', 'tophat', [-3., -1., -0.3]]
                # temperature moment, u = T*delta(1/T) (BBPower branch moments-T)
                gamma_d_u:    ['gamma_u',    'tophat', [-6., -3.5, -2.]]
                amp_d_u:      ['amp_u',      'tophat', [ 0.,  0.,   2.]]
                logsig_d_u:   ['logsig_u',   'tophat', [-3., -1.5, -0.3]]
                # beta-u correlation coefficient (free only with both d and dT)
                rho_d_bu:     ['rho_bu',     'tophat', [-1.,  0.,   1.]]

        component_2:
            name: Synchrotron
            sed: Synchrotron
            cl:
                BB: ClPowerLaw
            sed_parameters:
                beta_s: ['beta_pl', 'Gaussian', [-3.0, 0.3]]
                nu0_s:  ['nu0',     'fixed',    [23.]]
            cl_parameters:
                BB:
                    amp_s_bb:   ['amp',   'tophat', [0., 2., 8.]]
                    alpha_s_bb: ['alpha', 'tophat', [-2., -0.9, 0.5]]  # PySM s1: alpha_s ~ -0.9, the data push below -1
                    l0_s_bb:    ['ell0',  'fixed',  [80.]]
            moments:
                gamma_s_beta: ['gamma_beta', 'tophat', [-6., -3.5, -2.]]
                amp_s_beta:   ['amp_beta',   'tophat', [ 0.,  0.,   1.]]
                logsig_s_beta: ['logsig_beta', 'tophat', [-3., -1., -0.3]]
