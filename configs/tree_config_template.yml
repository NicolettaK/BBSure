# Validation tree config (template: @ROOT@ and @RUN@ are filled in by run_one.sh). HL likelihood, hierarchical moment prior (k = 10), lnB_preferred = 0, immediate pruning, emcee screening.
# Uso: python decision_tree.py --config config/tree_config.yml

paths:
    # Config BBPower di partenza (tutti i fit ne sono varianti)
    base_config:   "@ROOT@/code/config/base_config_tree.yml"
    # Data vector: prodotto UNA volta da run_spectra.sh
    cells_coadded: "@RUN@/output/cells_coadded.fits"
    cells_noise:   "@RUN@/output/cells_noise.fits"
    cells_fiducial: "@ROOT@/data/cls_fid_d1s1_hits_pg_n128.fits"
    # Cartella dove finisce ogni fit (una sottocartella per nodo) + log
    runs_dir:      "@RUN@/tree"

thresholds:
    # "Is chi2 good?"  ->  PTE > pte_min
    pte_min: 0.01
    # "Is model X preferred over Y?"  ->  ln B = lnZ_X - lnZ_Y > lnB_preferred
    # (scala di Jeffreys/Trotta: 1 debole, 2.5 moderata, 5 forte)
    lnB_preferred: 0.0
    # Momento rivelato nei residui: lo zero e' fuori dall'intervallo HPD
    # (frazione hpd_frac) di almeno una ampiezza degli spettri del gruppo
    hpd_frac: 0.68
    # Ramo frequentista (profile likelihood): M*_1 preferito su M*_0 se il
    # likelihood-ratio test da' p-value < lrt_alpha
    lrt_alpha: 0.05
    # Confronti in bilico: se |ln B - soglia| < seed_band * errore, PolyChord
    # ripetuto con altri semi (media di ln Z), fino a seed_max_runs run per fit
    seed_band: 2.0
    seed_max_runs: 1

moments:
    # Gruppi di momenti testati nei residui (vedi MOMENT_GROUPS in
    # decision_tree.py): Res_wr con tutto fissato al best fit di M_0,r,
    # Res_r0 sui residui di M_0,0 (r = 0). d2 / s2 solo se d / s ci sono gia'; ds1 = incrociati dust-synch al 1o ordine, ds2 = w1^beta_d x w1^beta_s (solo con d e s).
    res_wr: ['d', 's']
    res_r0: ['d', 's', 'dT', 'd2', 's2', 'ds1', 'ds2']
    # con la positivita' un incrociato richiede gli auto-spettri: ds1 (w1^beta_d x A_s,
    # A_d x w1^beta_s) richiede s
    requires: {ds1: ['s']}

emcee:
    # Screening della rivelazione nei test dei residui
    nwalkers: 32
    n_iters: 2000
    burn_frac: 0.5

profile:
    # Griglia in r per la profile likelihood
    r_min: -0.01
    r_max: 0.04
    n_r: 21

polychord:
    # nlive e nrepeat in proporzione ai parametri liberi di ogni run:
    #   nlive   = max(nlive_min,   nlive_per_dim   * ndim)
    #   nrepeat = max(nrepeat_min, nrepeat_per_dim * ndim)
    # es. residui (2D): 100 / 10;  M_none_r (7D): 175 / 21;  M_d+s_r (11D): 275 / 33
    # Senza le chiavi *_per_dim si usano i valori fissi nlive / nrepeat.
    nlive_per_dim: 15
    nlive_min: 100
    nrepeat_per_dim: 3
    nrepeat_min: 10
    nlive: 300
    nrepeat: 20
    # Processi MPI per ogni run di PolyChord (mpirun -np): 1 master + il
    # resto per la likelihood, quindi il guadagno massimo e' ~mpi_procs-1.
    # 1 = seriale. Non entra nel config di BBCompSep (i run restano riusabili).
    mpi_procs: 8
    # su Perlmutter: un passo srun dentro il job (16 tree per nodo)
    mpi_launcher: "srun -n {n} -c 2 --exact --cpu-bind=cores"

run:
    # Iterazioni massime del loop (ogni volta che un modello piu' complesso
    # viene adottato si riparte da "is chi2 good?")
    max_iterations: 5
    # Nel ramo frequentista, se M*_1,r vince il flowchart torna in cima.
    # true  -> si riparte usando M_1,r come modello di riferimento
    # false -> M_0,r resta il riferimento (lettura stretta della nota) e si
    #          va al test a 3 sigma
    frequentist_replaces_baseline: true
    # Riusa i fit gia' fatti (stesso config) invece di rilanciarli
    reuse_runs: true
