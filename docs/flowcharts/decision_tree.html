<!doctype html>
<meta charset="utf-8">
<title>Decision Tree v3</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Patrick+Hand&display=swap">
<style>
  /* One 16:9 slide (2560x1440): Bayesian search on the left, new profile scheme on the right */
  :root { --paper: #fdfdfb; --grid: #eceef1; --ink: #1e1e1e; }
  @page { size: 2560px 1440px; margin: 0; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  .canvas {
    width: 2560px; height: 1440px; position: relative;
    background-color: var(--paper);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px),
                      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
  }
  svg { display: block; }
  .t  { font-family: "Patrick Hand", "Kalam", cursive; font-size: 18px; fill: var(--ink); }
  .ts { font-family: "Patrick Hand", "Kalam", cursive; font-size: 17px; fill: var(--ink); }
  .yn { font-family: "Kalam", cursive; font-size: 19px; fill: var(--ink); }
  .tag { font-family: "Kalam", cursive; font-weight: 700; font-size: 22px; }
  .title { font-family: "Kalam", cursive; font-size: 36px; font-weight: 700; fill: var(--ink); }
  .subtitle { font-family: "Kalam", cursive; font-size: 21px; fill: var(--ink); }
  .ptitle { font-family: "Kalam", cursive; font-size: 28px; font-weight: 700; }
  .star { font-family: "Kalam", cursive; font-weight: 700; font-size: 19px; fill: var(--ink); }
  .note { font-family: "Patrick Hand", cursive; font-size: 17px; fill: var(--ink); }
  .badge { font-family: "Kalam", cursive; font-weight: 700; font-size: 19px; fill: #fff; }
</style>

<div class="canvas">
  <svg id="tree" width="2560" height="1440" viewBox="0 0 2560 1440" role="img"
       aria-label="Decision tree v3: Bayesian search for moments on the left (Res_wr, Res_r0: each round the family is added with r = 0 and its new spectra pruned with r = 0, giving M_1,0; first M_1,r, then M_1,0 is compared with M_0,r; otherwise Res_r0 on the residuals of M_1,0); on the right the new profile scheme replacing the frequentist branch: profile of r with the candidate, comparison of the two models at their own best fit, residual tests at r = r*, loop, and result on r from the profile likelihood."></svg>
</div>

<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
<script>
(function () {
  const svg = document.getElementById('tree');
  const NS = 'http://www.w3.org/2000/svg';
  const rc = rough.svg(svg);
  let seed = 11;
  const C = {
    green:  ['#2f9e44', '#ebfbee'], yellow: ['#d9a400', '#fff9db'],
    purple: ['#9c36b5', '#f8f0fc'], red:    ['#e03131', '#fff5f5'],
    blue:   ['#1971c2', '#d0ebff'], teal:   ['#0c8599', '#e3fafc'],
    orange: ['#e8590c', '#ffe8cc'], grey:   ['#868e96', '#f1f3f5'],
    ink:    ['#1e1e1e', '#1e1e1e'],
  };
  const add = el => { svg.appendChild(el); return el; };
  const style = (col, extra) => Object.assign({
    stroke: C[col][0], fill: C[col][1], fillStyle: 'solid',
    strokeWidth: 1.8, roughness: 1.0, seed: seed++ }, extra || {});
  function text(x, y, lines, cls, opts) {
    opts = opts || {};
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('class', cls || 't');
    t.setAttribute('x', x); t.setAttribute('y', y);
    t.setAttribute('text-anchor', opts.anchor || 'middle');
    if (opts.fill) t.setAttribute('fill', opts.fill);
    const lh = opts.lh || 20, y0 = y - (lines.length - 1) * lh / 2;
    lines.forEach((ln, i) => {
      const s = document.createElementNS(NS, 'tspan');
      s.setAttribute('x', x); s.setAttribute('y', y0 + i * lh);
      s.setAttribute('dominant-baseline', 'middle');
      s.innerHTML = ln; t.appendChild(s);
    });
    return add(t);
  }
  const box = (x, y, w, h, col, lines, cls, lh) => {
    add(rc.rectangle(x, y, w, h, style(col))); text(x + w / 2, y + h / 2, lines, cls || 'ts', { lh: lh || 19 }); };
  const diamond = (cx, cy, w, h, col, lines) => {
    add(rc.polygon([[cx, cy - h / 2], [cx + w / 2, cy], [cx, cy + h / 2], [cx - w / 2, cy]], style(col)));
    text(cx, cy, lines, 'ts', { lh: 18 }); };
  function star(cx, cy, r, col, lines) {
    const pts = [];
    for (let i = 0; i < 12; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 6, rr = i % 2 ? r * 0.72 : r;
      pts.push([cx + rr * Math.cos(a), cy + rr * Math.sin(a)]);
    }
    add(rc.polygon(pts, style(col)));
    text(cx, cy, lines, 'star', { lh: 21 });
  }
  function arrow(pts, label, lx, ly, col) {
    const ink = col ? C[col][0] : C.ink[0];
    add(rc.linearPath(pts, { stroke: ink, strokeWidth: 1.6, roughness: 0.8, seed: seed++ }));
    const [x1, y1] = pts[pts.length - 2], [x2, y2] = pts[pts.length - 1];
    const a = Math.atan2(y2 - y1, x2 - x1), L = 13, s = 0.45;
    [a + Math.PI - s, a + Math.PI + s].forEach(b =>
      add(rc.line(x2, y2, x2 + L * Math.cos(b), y2 + L * Math.sin(b),
                  { stroke: ink, strokeWidth: 1.6, roughness: 0.6, seed: seed++ })));
    if (label) text(lx, ly, [label], 'yn', { fill: ink });
  }
  // subscript with dy (baseline-shift loses the advance width in Chrome):
  // the zero-width space after it carries the shift back
  const sub = s => `<tspan dy="5" font-size="0.75em">${s}</tspan><tspan dy="-5">&#8203;</tspan>`;
  const M = (a, b) => `M${sub(a + ',' + b)}`;
  function badge(x, y, n, col) {
    add(rc.circle(x, y, 32, { stroke: C[col][0], fill: C[col][0], fillStyle: 'solid', strokeWidth: 1.2, roughness: 0.6, seed: seed++ }));
    text(x, y + 1, [String(n)], 'badge');
  }

  // ── title ──────────────────────────────────────────────────────────────
  text(30, 40, ['SO cross-cl pipeline: decision tree — Bayesian search + profile scheme'], 'title', { anchor: 'start' });
  text(30, 76, ['left: search for moments with the evidence (r marginalised) · right: profile scheme, every model at its own r'], 'subtitle', { anchor: 'start' });
  const M1 = `M${sub('1')}`;
  const note = (x, y, lines, col, lh) => text(x, y, lines, 'ts', { anchor: 'start', fill: C[col][0], lh: lh || 20 });

  // panel backgrounds (drawn first, under everything)
  add(rc.rectangle(18, 100, 1514, 1322, { stroke: 'none', fill: '#f3f3f3', fillStyle: 'solid', roughness: 0, seed: seed++ }));
  add(rc.rectangle(1550, 100, 992, 1322, { stroke: 'none', fill: '#f3f3f3', fillStyle: 'solid', roughness: 0, seed: seed++ }));

  // ═════════════════════ A: Bayesian search ═══════════════════════════════
  text(40, 130, ['A · Bayesian search for moments (evidence, r free)'], 'ptitle', { anchor: 'start', fill: C.grey[0] });

  box(40, 165, 250, 70, 'green', ['run BBPower without moments'], 't');
  text(300, 200, [M(0, 'r')], 'tag', { anchor: 'start', fill: C.green[0] });
  arrow([[165, 235], [165, 265]]);
  diamond(165, 335, 240, 130, 'yellow', ['is χ² good?', '(PTE &gt; 0.01)']);
  arrow([[165, 400], [165, 455]], 'Yes', 190, 428);
  diamond(165, 525, 240, 140, 'yellow', ['is r compatible', 'with zero at 1σ?']);

  // restart box
  box(1180, 165, 300, 70, 'green', [`${M(0, 'r')} = ${M(1, 'r')}: start again`], 't');
  arrow([[1180, 200], [460, 200], [460, 290], [262, 290]]);

  // ── Res_wr row (y = 525)
  arrow([[285, 335], [470, 335], [470, 458]], 'No', 330, 320);
  box(330, 460, 280, 130, 'purple', [`<tspan font-weight="700">Res_wr</tspan>: residuals of ${M(0, 'r')}`, 'all parameters fixed at their', 'best fit (r too); test the d and s', 'families, each with its own β free']);
  arrow([[285, 525], [328, 525]], 'No', 305, 510);
  arrow([[610, 525], [638, 525]]);
  diamond(760, 525, 240, 140, 'yellow', ['moment detected? (*)', 'Δχ² of the residual fit:', 'p &lt; 0.32 (1σ)']);
  arrow([[880, 525], [918, 525]], 'Yes', 898, 510);
  box(920, 465, 300, 120, 'purple', [`${M(0, 'r')} + a detected family,`, 'in order of significance (**);', 'full fit (all parameters free),', 'pruned (***)']);
  text(925, 448, [M(1, 'r')], 'tag', { anchor: 'start', fill: C.purple[0] });
  arrow([[1220, 525], [1228, 525]]);
  diamond(1360, 525, 260, 120, 'red', [`is ${M(1, 'r')} preferred`, `over ${M(0, 'r')}? (ln B &gt; 0) (****)`]);
  arrow([[1360, 465], [1360, 237]], 'Yes', 1385, 420);

  // ── Res_r0 row (y = 830)
  arrow([[760, 595], [760, 680], [440, 680], [440, 768]], 'No', 785, 625);
  arrow([[1360, 585], [1360, 710], [520, 710], [520, 768]], 'No', 1385, 625);
  box(330, 770, 280, 120, 'purple', [`<tspan font-weight="700">Res_r0</tspan>: residuals of ${M(0, 0)} (r = 0)`, 'all parameters fixed, own β free;', 'test the families', 'd, s, dT, d2, s2, ds1, ds2']);
  arrow([[610, 830], [638, 830]]);
  diamond(760, 830, 240, 140, 'yellow', ['moment detected? (*)', 'Δχ² of the residual fit:', 'p &lt; 0.32 (1σ)']);
  arrow([[880, 830], [918, 830]], 'Yes', 898, 815);
  box(920, 770, 300, 120, 'purple', [`${M1} + the detected family with the`, 'highest significance (**), r = 0;', 'new spectra pruned with r = 0 (***)', '(none left → the next family)']);
  text(925, 753, [M(1, 0)], 'tag', { anchor: 'start', fill: C.purple[0] });
  note(925, 915, [`${M1} = ${M(0, 'r')} at the first round,`, `then the ${M(1, 0)} of the previous one`], 'purple');
  note(1232, 742, [`${M(1, 'r')} = ${M(1, 0)} with r free,`, 'pruned with r free (***)'], 'purple');
  arrow([[1220, 830], [1228, 830]]);
  diamond(1360, 830, 260, 120, 'red', [`is ${M(1, 'r')} preferred`, `over ${M(0, 'r')}? (ln B &gt; 0) (****)`]);
  arrow([[1490, 830], [1510, 830], [1510, 200], [1482, 200]], 'Yes', 1490, 810);

  // ── M_1,0 and the next rounds
  arrow([[1360, 890], [1360, 958]], 'No', 1385, 912);
  diamond(1360, 1015, 280, 110, 'red', [`is ${M(1, 0)} (r = 0) preferred`, `over ${M(0, 'r')}? (ln B &gt; 0) (****)`]);
  arrow([[1220, 1015], [1182, 1015]], 'No', 1201, 1000);
  box(900, 965, 280, 100, 'purple', [`<tspan font-weight="700">Res_r0</tspan> on the residuals of ${M(1, 0)}`, `(${M1} = ${M(1, 0)}):`, 'test the families, next round']);
  arrow([[900, 1015], [830, 1015], [830, 863]]);
  arrow([[1360, 1070], [1360, 1180], [912, 1180]], 'Yes', 1385, 1098);
  note(960, 1160, [`→ ${M1} to the profile scheme`], 'teal');

  // ── 3 sigma test and conclusion
  arrow([[760, 900], [760, 1113]], 'No', 735, 950);
  diamond(760, 1180, 300, 130, 'yellow', [`is r of ${M(0, 'r')} compatible`, 'with zero at 3σ?']);
  arrow([[610, 1180], [470, 1180], [470, 1290]], 'Yes', 540, 1165);
  star(470, 1345, 54, 'blue', ['upper', 'limit']);
  arrow([[760, 1245], [760, 1290]], 'No', 785, 1268);
  star(760, 1345, 54, 'orange', ['r', 'detection']);
  arrow([[165, 595], [165, 1345], [414, 1345]], 'Yes', 190, 640);
  note(850, 1330, ['Bayesian result: always the', `posterior of r of ${M(0, 'r')}`], 'grey', 22);

  // then the profile scheme, with M_0,r and M_1
  // from both conclusions of the tree
  add(rc.linearPath([[470, 1400], [470, 1408], [760, 1408]], { stroke: C.teal[0], strokeWidth: 1.6, roughness: 0.8, seed: seed++ }));
  arrow([[760, 1400], [760, 1408], [1541, 1408], [1541, 240], [1578, 240]], null, 0, 0, 'teal');
  text(1080, 1390, [`then the profile scheme (with ${M(0, 'r')} and ${M1})`], 'yn', { anchor: 'start', fill: C.teal[0] });

  // ═════════════════════ B: profile scheme ════════════════════════════════
  text(1575, 130, ['B · Profile scheme: every model at its own r'], 'ptitle', { anchor: 'start', fill: C.teal[0] });
  const rc_ = `r*${sub('c')}`;
  box(1580, 165, 560, 150, 'green', [`<tspan font-weight="700">M* = ${M(0, 'r')}, the final model of the tree</tspan>`,
       'candidates c = M* + every combination of the',
       `families added in the last Res_r0 (${M1} included),`,
       'respecting their requirements (ds1 only with s)'], 't', 26);
  note(2160, 215, [`${M(0, 'r')} and ${M1}: the lower and the`, 'upper end of the moments;', 'the same candidates whether', `${M(1, 0)} was preferred or not`], 'green');
  arrow([[1860, 315], [1860, 345]]);
  box(1580, 345, 560, 95, 'purple', ['<tspan font-weight="700">profiles in r</tspan>',
       'M* → r* = its minimum',
       `every candidate c → ${rc_} = its minimum`], 't', 25);
  note(2160, 382, ['profile: r fixed on a grid, all the', 'other parameters re-fitted (ML)'], 'purple');
  arrow([[1860, 440], [1860, 475]]);
  box(1580, 475, 560, 130, 'purple', ['<tspan font-weight="700">compare all the models, each at its own r</tspan>',
       `M* at r*, every candidate c at ${rc_}:`,
       'local evidence (****) of each (its moment',
       'spectra free; β_d, β_s free in all, T_d only with dT)'], 't', 25);
  arrow([[1860, 605], [1860, 640]]);
  box(1580, 640, 560, 80, 'red', ['<tspan font-weight="700">final model = the one with the highest evidence</tspan>',
       '(M* itself if no candidate beats it)'], 't', 26);
  arrow([[1860, 720], [1860, 755]]);
  box(1580, 755, 560, 105, 'purple', ['<tspan font-weight="700">profile of the final model in r</tspan>',
       `r_min = its minimum (r* or ${rc_});`,
       'posterior of r = exp(-Δχ²/2) × prior of the tree'], 't', 26);
  box(2190, 755, 330, 105, 'purple', ['<tspan font-weight="700">other parameters</tspan>',
       'posterior conditional on r = r_min', '(emcee, r fixed, the rest free)'], 'ts', 24);
  add(rc.linearPath([[2140, 807], [2190, 807]], { stroke: C.purple[0], strokeWidth: 1.4, roughness: 0.8, seed: seed++ }));
  arrow([[1860, 860], [1860, 910]]);
  diamond(1860, 990, 340, 150, 'yellow', ['0 within the central 3σ', 'interval of the posterior of r?']);
  arrow([[2030, 990], [2178, 990]], 'Yes', 2100, 975);
  star(2240, 990, 60, 'blue', ['upper', 'limit']);
  note(2312, 990, ['r_95 of the posterior', 'with r ≥ 0'], 'blue');
  arrow([[1860, 1065], [1860, 1120], [2178, 1120]], 'No', 1885, 1092);
  star(2240, 1125, 60, 'orange', ['r', 'detection']);
  note(2312, 1125, ['median and 68%', 'of the posterior of r'], 'orange');

  // footnotes
  text(1580, 1300, ['(*) ML fit of the family on the residuals (everything else', 'fixed): Δχ² vs the base fit, χ² with k = amplitudes of the', 'family degrees of freedom; detected if p &lt; 0.32 (1σ, the', 'analogue of 0 outside the 68% HPD); the family enters whole',
                    '(**) significance: p of the residual test of each detected', 'family; it sets the order in which the families are tried', '(Res_wr) or picks the one added (Res_r0)'], 'note', { anchor: 'start', lh: 21 });
  text(2070, 1300, ['(***) amplitudes with 0 in their 68% HPD (posterior of the', 'full fit) removed and the model refitted, until all are', 'detected; the pruned model is kept if ln B(pruned vs full) > 0', `and is the one compared with ${M(0, 'r')}; for ${M(1, 0)} only the`, 'new spectra are pruned, with r = 0',
                    '(****) ln B within 2σ of the threshold (A) or between the', 'two best models (B): PolyChord repeated with other seeds,', 'mean of ln Z, up to 3 runs per fit'], 'note', { anchor: 'start', lh: 21 });
})();
</script>
