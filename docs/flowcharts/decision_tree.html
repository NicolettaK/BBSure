<!doctype html>
<meta charset="utf-8">
<title>Decision Tree v3</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Patrick+Hand&display=swap">
<style>
  /* One 16:9 slide (2560x1440): Bayesian search on the left, new profile scheme on the right */
  :root { --paper: #fdfdfb; --grid: #eceef1; --ink: #1e1e1e; }
  @page { size: 2560px 1440px; margin: 0; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  .canvas {
    width: 2560px; height: 1440px; position: relative;
    background-color: var(--paper);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px),
                      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 24px 24px;
  }
  svg { display: block; }
  .t  { font-family: "Patrick Hand", "Kalam", cursive; font-size: 18px; fill: var(--ink); }
  .ts { font-family: "Patrick Hand", "Kalam", cursive; font-size: 16px; fill: var(--ink); }
  .yn { font-family: "Kalam", cursive; font-size: 19px; fill: var(--ink); }
  .tag { font-family: "Kalam", cursive; font-weight: 700; font-size: 22px; }
  .title { font-family: "Kalam", cursive; font-size: 36px; font-weight: 700; fill: var(--ink); }
  .subtitle { font-family: "Kalam", cursive; font-size: 21px; fill: var(--ink); }
  .ptitle { font-family: "Kalam", cursive; font-size: 28px; font-weight: 700; }
  .star { font-family: "Kalam", cursive; font-weight: 700; font-size: 19px; fill: var(--ink); }
  .note { font-family: "Patrick Hand", cursive; font-size: 17px; fill: var(--ink); }
  .badge { font-family: "Kalam", cursive; font-weight: 700; font-size: 19px; fill: #fff; }
</style>

<div class="canvas">
  <svg id="tree" width="2560" height="1440" viewBox="0 0 2560 1440" role="img"
       aria-label="Decision tree v3: Bayesian search for moments on the left (Res_wr, Res_r0, M_1,r and M_1,0 comparisons); on the right the new profile scheme replacing the frequentist branch: profile of r with the candidate, comparison of the two models at their own best fit, residual tests at r = r*, loop, and result on r from the profile likelihood."></svg>
</div>

<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
<script>
(function () {
  const svg = document.getElementById('tree');
  const NS = 'http://www.w3.org/2000/svg';
  const rc = rough.svg(svg);
  let seed = 11;
  const C = {
    green:  ['#2f9e44', '#b2f2bb'], yellow: ['#d9a400', '#ffec99'],
    purple: ['#9c36b5', '#eebefa'], red:    ['#e03131', '#ffc9c9'],
    blue:   ['#1971c2', '#a5d8ff'], teal:   ['#0c8599', '#99e9f2'],
    orange: ['#e8590c', '#ffd8a8'], grey:   ['#868e96', '#f1f3f5'],
    ink:    ['#1e1e1e', '#1e1e1e'],
  };
  const add = el => { svg.appendChild(el); return el; };
  const style = (col, extra) => Object.assign({
    stroke: C[col][0], fill: C[col][1], fillStyle: 'hachure', hachureGap: 7,
    fillWeight: 0.6, strokeWidth: 1.4, roughness: 1.1, seed: seed++ }, extra || {});
  function text(x, y, lines, cls, opts) {
    opts = opts || {};
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('class', cls || 't');
    t.setAttribute('x', x); t.setAttribute('y', y);
    t.setAttribute('text-anchor', opts.anchor || 'middle');
    if (opts.fill) t.setAttribute('fill', opts.fill);
    const lh = opts.lh || 20, y0 = y - (lines.length - 1) * lh / 2;
    lines.forEach((ln, i) => {
      const s = document.createElementNS(NS, 'tspan');
      s.setAttribute('x', x); s.setAttribute('y', y0 + i * lh);
      s.setAttribute('dominant-baseline', 'middle');
      s.innerHTML = ln; t.appendChild(s);
    });
    return add(t);
  }
  const box = (x, y, w, h, col, lines, cls, lh) => {
    add(rc.rectangle(x, y, w, h, style(col))); text(x + w / 2, y + h / 2, lines, cls || 'ts', { lh: lh || 19 }); };
  const diamond = (cx, cy, w, h, col, lines) => {
    add(rc.polygon([[cx, cy - h / 2], [cx + w / 2, cy], [cx, cy + h / 2], [cx - w / 2, cy]], style(col)));
    text(cx, cy, lines, 'ts', { lh: 18 }); };
  function star(cx, cy, r, col, lines) {
    const pts = [];
    for (let i = 0; i < 12; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 6, rr = i % 2 ? r * 0.72 : r;
      pts.push([cx + rr * Math.cos(a), cy + rr * Math.sin(a)]);
    }
    add(rc.polygon(pts, style(col, { hachureGap: 5 })));
    text(cx, cy, lines, 'star', { lh: 21 });
  }
  function arrow(pts, label, lx, ly, col) {
    const ink = col ? C[col][0] : C.ink[0];
    add(rc.linearPath(pts, { stroke: ink, strokeWidth: 1.6, roughness: 0.8, seed: seed++ }));
    const [x1, y1] = pts[pts.length - 2], [x2, y2] = pts[pts.length - 1];
    const a = Math.atan2(y2 - y1, x2 - x1), L = 13, s = 0.45;
    [a + Math.PI - s, a + Math.PI + s].forEach(b =>
      add(rc.line(x2, y2, x2 + L * Math.cos(b), y2 + L * Math.sin(b),
                  { stroke: ink, strokeWidth: 1.6, roughness: 0.6, seed: seed++ })));
    if (label) text(lx, ly, [label], 'yn', { fill: ink });
  }
  const sub = s => `<tspan baseline-shift="sub" font-size="13">${s}</tspan>`;
  const M = (a, b) => `M${sub(a + ',' + b)}`;
  function badge(x, y, n, col) {
    add(rc.circle(x, y, 32, { stroke: C[col][0], fill: C[col][0], fillStyle: 'solid', strokeWidth: 1.2, roughness: 0.6, seed: seed++ }));
    text(x, y + 1, [String(n)], 'badge');
  }

  // ── title ──────────────────────────────────────────────────────────────
  text(30, 40, ['SO cross-cl pipeline: decision tree v3 — Bayesian search + profile scheme'], 'title', { anchor: 'start' });
  text(30, 74, ['left: search for moments with the evidence · right: profile scheme, every model at its own r'], 'subtitle', { anchor: 'start' });

  // ═════════════════════ LEFT: Bayesian search ════════════════════════════
  // panel backgrounds (drawn first, under everything)
  add(rc.rectangle(18, 100, 1262, 1320, { stroke: 'none', fill: '#f0f0f0', fillStyle: 'solid', roughness: 0, seed: seed++ }));
  add(rc.rectangle(1300, 100, 1242, 1320, { stroke: 'none', fill: '#f0f0f0', fillStyle: 'solid', roughness: 0, seed: seed++ }));
  text(36, 128, ['A · Bayesian search for moments (evidence, r free)'], 'ptitle', { anchor: 'start', fill: C.grey[0] });

  box(40, 160, 250, 70, 'green', ['run BBPower without moments'], 't');
  text(300, 197, [M(0, 'r')], 'tag', { anchor: 'start', fill: C.green[0] });
  arrow([[165, 230], [165, 262]]);
  diamond(165, 330, 230, 130, 'yellow', ['is χ² good?', '(PTE &gt; 0.01)']);
  arrow([[165, 395], [165, 450]], 'Yes', 190, 422);
  diamond(165, 520, 230, 140, 'yellow', ['is r compatible', 'with zero at 1σ?']);
  arrow([[165, 590], [165, 1345], [948, 1345]], 'Yes', 190, 640);

  // Res_wr
  box(360, 465, 280, 130, 'purple', [`Res_wr: residuals of ${M(0, 'r')}`, 'all parameters fixed at their', 'best fit (r too); test the d and s', 'families of moments, each with', 'its own β free']);
  arrow([[280, 330], [500, 330], [500, 468]], 'No', 320, 316);
  arrow([[280, 520], [358, 520]], 'No', 316, 505);
  arrow([[640, 530], [690, 530]]);
  diamond(800, 530, 240, 140, 'yellow', ['moment detected? (*)', '0 outside the 68% HPD', 'of an amplitude']);
  arrow([[910, 530], [960, 530]], 'Yes', 935, 515);
  box(960, 470, 280, 120, 'purple', [`${M(0, 'r')} + a detected family,`, 'in order of residual evidence (**);', 'full fit (all parameters free),', 'pruned (***)']);
  text(965, 447, [M(1, 'r')], 'tag', { anchor: 'start', fill: C.purple[0] });
  arrow([[1100, 580], [1100, 620]]);
  diamond(1100, 690, 240, 130, 'red', [`is ${M(1, 'r')} preferred (****)`, `over ${M(0, 'r')}? (ln B &gt; 0)`]);
  box(950, 200, 300, 80, 'green', [`${M(0, 'r')} = ${M(1, 'r')},`, 'start again']);
  arrow([[1220, 690], [1262, 690], [1262, 240], [1252, 240]], 'Yes', 1240, 660);
  arrow([[950, 240], [480, 240], [480, 290], [255, 290]]);

  // Res_r0
  arrow([[800, 595], [800, 760], [500, 760], [500, 818]], 'No', 825, 650);
  arrow([[1100, 755], [1100, 785], [560, 785], [560, 818]], 'No', 1125, 772);
  text(270, 1122, ['(*) all the amplitudes of the family are fitted (emcee);', 'detected if 0 is outside the 68% HPD (highest posterior', 'density interval) of at least one of them; only the', 'amplitudes with 0 outside their HPD are kept',
                    '(**) residual evidence: ln Z of the residual fit of each', 'detected family; it only sets the order in which the', 'families are tried',
                    '(***) amplitudes with 0 in their 68% HPD (posterior of', 'the full fit) removed and the model refitted, until all are', 'detected; the pruned model is kept if ln B(pruned vs full) > 0', `and is the one compared with ${M(0, 'r')}`, '(****) ln B within 2σ of the threshold (A) or between the', 'two best models (B): PolyChord repeated with other seeds,', 'mean of ln Z, up to 3 runs per fit'], 'note', { anchor: 'start', lh: 21 });
  box(360, 820, 280, 120, 'purple', [`Res_r0: residuals of ${M(0, 0)} (r = 0)`, 'all parameters fixed, own β free;', 'test the families of moments', 'd, s, dT, d2, s2, ds1, ds2']);
  arrow([[640, 880], [690, 880]]);
  diamond(800, 880, 240, 140, 'yellow', ['moment detected? (*)', '0 outside the 68% HPD', 'of an amplitude']);
  arrow([[910, 880], [960, 880]], 'Yes', 935, 865);
  box(960, 820, 280, 120, 'purple', [`${M(0, 'r')} + the detected family`, 'with the highest residual evidence (**);', 'full fit (all parameters free),', 'pruned (***)']);
  text(965, 797, [M(1, 'r')], 'tag', { anchor: 'start', fill: C.purple[0] });
  arrow([[1100, 930], [1100, 965]]);
  diamond(1100, 1035, 240, 130, 'red', [`is ${M(1, 'r')} preferred (****)`, `over ${M(0, 'r')}? (ln B &gt; 0)`]);
  arrow([[1220, 1035], [1262, 1035], [1262, 700]], 'Yes', 1240, 1010);
  // Bayesian conclusion on M_0,r
  arrow([[1100, 1100], [1100, 1150]], 'No', 1125, 1125);
  arrow([[800, 945], [800, 1215], [945, 1215]], 'No', 825, 1000);
  diamond(1100, 1215, 310, 130, 'yellow', [`is r of ${M(0, 'r')} compatible`, 'with zero at 3σ?']);
  arrow([[1100, 1280], [1100, 1300], [1000, 1300], [1000, 1293]], 'Yes', 1040, 1292);
  star(1000, 1345, 52, 'blue', ['upper', 'limit']);
  arrow([[1100, 1300], [1190, 1300], [1190, 1293]], 'No', 1150, 1292);
  star(1190, 1345, 52, 'orange', ['r', 'detection']);
  text(560, 1380, ['Bayesian conclusion', `(posterior of ${M(0, 'r')}, r marginalised)`], 'ts', { anchor: 'start', fill: C.grey[0], lh: 20 });

  // in all cases the profile scheme follows
  add(rc.linearPath([[1000, 1397], [1000, 1412], [1325, 1412]], { stroke: C.teal[0], strokeWidth: 1.6, roughness: 0.8, seed: seed++ }));
  add(rc.linearPath([[1190, 1397], [1190, 1412]], { stroke: C.teal[0], strokeWidth: 1.6, roughness: 0.8, seed: seed++ }));
  arrow([[1325, 1412], [1325, 232], [1438, 232]], null, 0, 0, 'teal');
  text(1340, 700, ['then', 'profile', 'scheme'], 'yn', { anchor: 'start', fill: C.teal[0], lh: 22 });

  // ═════════════════════ RIGHT: profile scheme ═══════════════════════════
  text(1460, 128, ['B · Profile scheme: every model at its own r'], 'ptitle', { anchor: 'start', fill: C.teal[0] });
  const rg = 'r*<tspan baseline-shift="sub" font-size="13">g</tspan>';
  const note = (x, y, lines, col) => text(x, y, lines, 'ts', { anchor: 'start', fill: C[col][0], lh: 20 });

  // start
  box(1440, 175, 600, 110, 'green', [`<tspan font-weight="700">M* = final model of the tree (${M(0, 'r')})</tspan>`,
       'candidates g: the families detected (among all tested)', 'in its last Res_r0 (none if not reached or nothing detected)'], 't', 26);
  arrow([[1740, 285], [1740, 330]]);

  // profiles
  box(1440, 330, 600, 105, 'purple', ['<tspan font-weight="700">profiles in r</tspan>',
       'M* → r* = its minimum',
       `M* + g for each candidate g → ${rg} = its minimum`], 't', 26);
  note(2060, 382, ['profile: r fixed on a grid, all the other', 'parameters re-fitted (max likelihood)'], 'purple');
  arrow([[1740, 435], [1740, 480]]);

  // comparison
  box(1440, 480, 600, 135, 'purple', ['<tspan font-weight="700">compare all the models, each at its own r</tspan>',
       `M* at r*, M* + g at ${rg} for every candidate g:`,
       'local evidence (****) of each (its moment spectra free;',
       'β_d and β_s free in all, T_d only with dT)'], 't', 26);
  arrow([[1740, 615], [1740, 682]]);

  // final model
  box(1440, 682, 600, 80, 'red', ['<tspan font-weight="700">final model = the one with the highest evidence</tspan>',
       '(M* itself if no candidate beats it)'], 't', 26);
  arrow([[1740, 762], [1740, 808]]);

  // result
  box(1440, 808, 600, 110, 'purple', ['<tspan font-weight="700">profile of the final model in r</tspan>',
       `r_min = its minimum (r* or ${rg});`,
       'posterior of r = exp(-Δχ²/2) × prior of the tree'], 't', 26);
  box(2100, 808, 400, 110, 'purple', ['<tspan font-weight="700">other parameters</tspan>',
       'posterior conditional on r = r_min:', 'emcee with r fixed, the rest free'], 't', 26);
  add(rc.linearPath([[2040, 863], [2100, 863]], { stroke: C.purple[0], strokeWidth: 1.4, roughness: 0.8, seed: seed++ }));
  arrow([[1740, 918], [1740, 975]]);
  diamond(1740, 1060, 360, 170, 'yellow', ['0 within the central 3σ', 'interval of the posterior of r?']);
  arrow([[1920, 1060], [2060, 1060], [2060, 1010], [2128, 1010]], 'Yes', 1990, 1045);
  star(2200, 1010, 68, 'blue', ['upper', 'limit']);
  note(2285, 1010, ['r_95 of the posterior', 'with r ≥ 0'], 'blue');
  arrow([[1740, 1145], [1740, 1200], [2128, 1200]], 'No', 1765, 1175);
  star(2200, 1200, 68, 'orange', ['r', 'detection']);
  note(2285, 1200, ['median and 68%', 'of the posterior of r'], 'orange');
})();
</script>
